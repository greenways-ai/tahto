[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tahto-vault"
version = "0.1.0.dev0"
description = "Streaming content-addressed object vault for the Tahto fabric"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[tool.setuptools]
package-dir = {"" = "src-python"}

[tool.setuptools.packages.find]
where = ["src-python"]
