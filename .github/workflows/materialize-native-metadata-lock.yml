name: Materialize native metadata lock

on:
  push:
    branches: [agent/metadata-store-sqlite]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/metadata-store-sqlite
          fetch-depth: 0
      - name: Install the reviewed Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Verify and materialize the native dependency graph
        run: |
          cargo fmt --manifest-path native/Cargo.toml --all -- --check
          cargo test --quiet --manifest-path native/Cargo.toml --workspace
      - name: Restore locked normal conformance
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/bootstrap-conformance.yml')
          source = path.read_text()
          source = source.replace(
              'cargo test --quiet --manifest-path native/Cargo.toml --workspace',
              'cargo test --locked --quiet --manifest-path native/Cargo.toml --workspace',
          )
          source = source.replace(
              'cargo test --manifest-path native/Cargo.toml --workspace',
              'cargo test --locked --quiet --manifest-path native/Cargo.toml --workspace',
          )
          source = source.replace(
              '''      - name: Capture the generated native dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: tahto-native-cargo-lock
          path: native/Cargo.lock
          if-no-files-found: error
''',
              '',
          )
          source = source.replace(
              '''      - name: Print the generated native dependency lock
        run: cat native/Cargo.lock
''',
              '',
          )
          path.write_text(source)
          PY
          rm .github/workflows/materialize-native-metadata-lock.yml
      - name: Commit the reviewed lock and CI boundary
        run: |
          git config user.name "greenways-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add native/Cargo.lock .github/workflows/bootstrap-conformance.yml .github/workflows/materialize-native-metadata-lock.yml
          git diff --cached --check
          git commit -m "Lock the SQLite metadata provider dependency graph"
          git push origin HEAD:agent/metadata-store-sqlite
