name: Tahto conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository and route boundaries
        run: python3 conformance/check-bootstrap.py
      - name: Validate stable fabric records and fixtures
        run: python3 conformance/check-protocol.py
      - name: Check conformance script syntax
        run: |
          python3 -m py_compile conformance/check-bootstrap.py
          python3 -m py_compile conformance/check-protocol.py
      - name: Guard the portable HAL state-kernel boundary
        run: |
          test ! -e src-python
          test ! -e test-python
          test ! -e .github/workflows/materialize-native-metadata-lock.yml
          test ! -e .github/workflows/promote-native-metadata-sqlite.yml
          test -z "$(find src test -type f ! -name '*.hal' ! -name 'README.md' -print)"
          ! grep -F ':hoplite/authentication' project.edn
          ! grep -R -E 'extern crate|use [A-Za-z0-9_]+::|#include' src test
          test -f src/tahto/store/model.hal
          test -f src/tahto/store/host.hal
          test -f src/tahto/store/capability.hal
          test -f src/tahto/store/upload.hal
          test -f src/tahto/store/response_source.hal
          test -f src/tahto/store/memory_blob.hal
          test -f src/tahto/store/memory_store.hal
          test -f src/tahto/store/vault.hal
          test -f src/tahto/store/graph.hal
          test -f src/tahto/store/history.hal
          test -f src/tahto/store/transaction.hal
          test -f src/tahto/store/provider.hal
          test -f src/tahto/semantic/model.hal
          test -f src/tahto/semantic/admission.hal
          test -f src/tahto/semantic/index.hal
          test -f src/tahto/semantic/root.hal
          test -f src/tahto/semantic/history.hal
          test -f src/tahto/semantic/canonical_value.hal
          test -f src/tahto/semantic/read.hal
          test -f src/tahto/semantic/prepare.hal
          test -f src/tahto/semantic/submit.hal
          test -f src/tahto/sync/device.hal
          test -f src/tahto/sync/session.hal
          test -f src/tahto/service/state.hal
          test -f src/tahto/protocol/validate.hal
          test -f test/tahto/store/vault_test.hal
          test -f test/tahto/store/graph_test.hal
          test -f test/tahto/store/history_test.hal
          test -f test/tahto/store/vault_hardening_test.hal
          test -f test/tahto/store/transaction_test.hal
          test -f test/tahto/store/provider_test.hal
          test -f test/tahto/store/capability_test.hal
          test -f test/tahto/store/upload_test.hal
          test -f test/tahto/store/response_source_test.hal
          test -f test/tahto/store/memory_blob_test.hal
          test -f test/tahto/store/memory_store_test.hal
          test -f test/tahto/semantic/model_test.hal
          test -f test/tahto/semantic/admission_test.hal
          test -f test/tahto/semantic/index_root_test.hal
          test -f test/tahto/semantic/history_test.hal
          test -f test/tahto/semantic/canonical_value_test.hal
          test -f test/tahto/semantic/read_test.hal
          test -f test/tahto/semantic/prepare_test.hal
          test -f test/tahto/semantic/submit_test.hal
          test -f test/tahto/semantic/submit_context_test.hal
          test -f test/tahto/sync/device_test.hal
          test -f test/tahto/sync/session_test.hal
          test -f test/tahto/sync/two_device_object_test.hal
          test -f test/tahto/service/state_test.hal
          test -f protocol/services.md
          test -f protocol/transactions.md
          test -f protocol/metadata-store.md
          test -f protocol/metadata-host.md
          test -f protocol/host-capabilities.md
          test -f protocol/upload-integration.md
          test -f protocol/response-sources.md
          test -f protocol/two-device-object-transfer.md
          test -f protocol/semantic-values.md
          test -f protocol/semantic-admission.md
          test -f protocol/semantic-index-roots.md
          test -f protocol/semantic-history.md
          test -f protocol/canonical-values.md
          test -f protocol/semantic-read.md
          test -f protocol/semantic-prepare.md
          test -f protocol/semantic-submit.md

          grep -F '(def host-service "hoplite.blob")' src/tahto/store/capability.hal
          grep -F '(def host-service "hoplite.store")' src/tahto/store/provider.hal
          grep -F '(ns tahto.store.upload' src/tahto/store/upload.hal
          grep -F '(ns tahto.store.response-source' src/tahto/store/response_source.hal
          grep -F '[hoplite.response-source :as portable]' src/tahto/store/response_source.hal
          grep -F 'portable/response-source?' src/tahto/store/response_source.hal
          grep -F '(ns tahto.store.memory-blob' src/tahto/store/memory_blob.hal
          grep -F '(ns tahto.store.memory-store' src/tahto/store/memory_store.hal
          grep -F '(ns tahto.semantic.model' src/tahto/semantic/model.hal
          grep -F '(ns tahto.semantic.admission' src/tahto/semantic/admission.hal
          grep -F '(ns tahto.semantic.index' src/tahto/semantic/index.hal
          grep -F '(ns tahto.semantic.root' src/tahto/semantic/root.hal
          grep -F '(ns tahto.semantic.history' src/tahto/semantic/history.hal
          grep -F '(ns tahto.semantic.canonical-value' src/tahto/semantic/canonical_value.hal
          grep -F '(ns tahto.semantic.read' src/tahto/semantic/read.hal
          grep -F '(ns tahto.semantic.prepare' src/tahto/semantic/prepare.hal
          grep -F '(ns tahto.semantic.submit' src/tahto/semantic/submit.hal
          grep -F '(def operation "semantic.read")' src/tahto/semantic/read.hal
          grep -F '"semantic.prepare"' src/tahto/semantic/prepare.hal
          grep -F '"semantic.submit"' src/tahto/semantic/submit.hal
          grep -F '"semantic.read"' src/tahto/protocol/validate.hal
          grep -F '"semantic.prepare"' src/tahto/protocol/validate.hal
          grep -F '"semantic.submit"' src/tahto/protocol/validate.hal
          grep -F '[hoplite.value :as portable]' src/tahto/semantic/canonical_value.hal
          grep -F 'portable/verification-request' src/tahto/semantic/canonical_value.hal
          grep -F '(def admission-fields' src/tahto/semantic/admission.hal
          grep -F ':semantic-objects' src/tahto/semantic/admission.hal
          grep -F ':semantic-indexes' src/tahto/semantic/index.hal
          grep -F ':semantic-roots' src/tahto/semantic/root.hal
          grep -F '"tahto.schema-ref/1"' src/tahto/semantic/model.hal
          grep -F '"tahto.canonical-value-verification/1"' src/tahto/semantic/model.hal
          grep -F '"tahto.semantic-link/1"' src/tahto/semantic/model.hal
          grep -F '"tahto.semantic-object/1"' src/tahto/semantic/model.hal
          grep -F '"tahto.semantic-index/1"' src/tahto/semantic/model.hal
          grep -F '"tahto.semantic-root/1"' src/tahto/semantic/model.hal
          grep -F '"tahto.semantic-commit-intent/1"' src/tahto/semantic/prepare.hal
          grep -F '"tahto.semantic-head-intent/1"' src/tahto/semantic/prepare.hal
          grep -F '"tahto.semantic-prepare-result/1"' src/tahto/semantic/prepare.hal
          grep -F '"tahto.semantic-submit-result/1"' src/tahto/semantic/submit.hal
          grep -F '(transaction/execute' src/tahto/semantic/submit.hal
          grep -F '(provider/prepare-compare-and-swap' src/tahto/semantic/submit.hal
          grep -F '(ns tahto.semantic.model-test' test/tahto/semantic/model_test.hal
          grep -F '(ns tahto.semantic.admission-test' test/tahto/semantic/admission_test.hal
          grep -F '(ns tahto.semantic.index-root-test' test/tahto/semantic/index_root_test.hal
          grep -F '(ns tahto.semantic.history-test' test/tahto/semantic/history_test.hal
          grep -F '(ns tahto.semantic.canonical-value-test' test/tahto/semantic/canonical_value_test.hal
          grep -F '(ns tahto.semantic.read-test' test/tahto/semantic/read_test.hal
          grep -F '(ns tahto.semantic.prepare-test' test/tahto/semantic/prepare_test.hal
          grep -F '(ns tahto.semantic.submit-test' test/tahto/semantic/submit_test.hal
          grep -F '(ns tahto.semantic.submit-context-test' test/tahto/semantic/submit_context_test.hal
          grep -F '(ns tahto.sync.two-device-object-test' test/tahto/sync/two_device_object_test.hal
          grep -F '(vault/accept-install candidate translated)' src/tahto/store/upload.hal

          grep -F '## Readiness matrix' README.md
          grep -F '| Semantic value profiles | ready |' README.md
          grep -F 'service: hoplite.store' protocol/metadata-store.md
          grep -F '"metadataHost" "generic-installed-hara-store-no-request-selection"' src/tahto/protocol/descriptor.hal
          grep -F '"objectResponseSource" "request-scoped-transport-ready"' src/tahto/protocol/descriptor.hal
          grep -F '"portableTwoDeviceLaw" "ready"' src/tahto/protocol/descriptor.hal
          grep -F '"semanticFabric" "kernel-ready:service-pending"' src/tahto/protocol/descriptor.hal
          grep -F '"semanticRoutes" "not-exposed"' src/tahto/protocol/descriptor.hal
          grep -F '"canonicalValueProvider" "not-installed"' src/tahto/protocol/descriptor.hal

          ! grep -R -F '(def native-abi' src/tahto
          ! grep -R -F ':native-abi' src/tahto
          ! grep -R -F '(def host-service "tahto.' src/tahto
          ! grep -R -F '"tahto-metadata-store/1"' src/tahto
          ! grep -R -F ':source-handle' src/tahto/semantic
          ! grep -R -F ':provider' src/tahto/semantic
          ! grep -R -F ':path' src/tahto/semantic
          ! grep -R -F ':url' src/tahto/semantic
          ! grep -F 'object-transfer execution and native response-source streaming remain' README.md
          grep -F '(ns tahto.node.request-auth' src/tahto/node/request_auth.hal
          grep -F '"verify-signature"' src/tahto/node/request_auth.hal
          grep -F '(fresh? request now-seconds)' src/tahto/node/request_auth.hal

  hoplite-state:
    runs-on: ubuntu-latest
    env:
      HARA_REVISION: 45eebddeca2a61e490337c90821b30b2328749e0
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Verify the reviewed Hara revision pin
        run: test "$(tr -d '\n' < packaging/hara-revision)" = "$HARA_REVISION"
      - name: Check out the reviewed Hara runtime
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara
          ref: ${{ env.HARA_REVISION }}
          path: .dependencies/technology/hara
          persist-credentials: false
      - name: Check out the Hoplite application boundary
        uses: actions/checkout@v4
        with:
          repository: greenways-ai/hoplite
          ref: main
          path: .dependencies/technology/hoplite
          persist-credentials: false
      - name: Install the Cargo toolchain required by the locked graph
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - name: Build the reviewed Hara test runner
        run: cargo build --locked --release --manifest-path .dependencies/technology/hara/core/rust/Cargo.toml --bin hara
      - name: Stage the Hoplite-owned portable contracts
        run: |
          mkdir -p .conformance-src/hoplite
          cp .dependencies/technology/hoplite/core/lib/src/hoplite/value.hal .conformance-src/hoplite/value.hal
          cp .dependencies/technology/hoplite/core/lib/src/hoplite/response_source.hal .conformance-src/hoplite/response_source.hal
      - name: Run the Hoplite-backed state conformance suites
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("project.edn")
          source = path.read_text()
          source = source.replace(':project/source-paths ["src"]', ':project/source-paths ["src" ".conformance-src"]')
          if source == path.read_text():
              raise SystemExit("project.edn source paths were not updated")
          path.write_text(source)
          PY
          .dependencies/technology/hara/core/rust/target/release/hara test

  native-migration-source:
    name: Transitional native metadata migration source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the reviewed Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Check the transitional metadata source formatting
        run: cargo fmt --manifest-path native/Cargo.toml --all -- --check
      - name: Preserve frozen migration behavior until issue #17 removes it
        run: cargo test --locked --quiet --manifest-path native/Cargo.toml --workspace
