name: Tahto conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository and route boundaries
        run: python3 conformance/check-bootstrap.py
      - name: Validate stable fabric records and fixtures
        run: python3 conformance/check-protocol.py
      - name: Check conformance script syntax
        run: |
          python3 -m py_compile conformance/check-bootstrap.py
          python3 -m py_compile conformance/check-protocol.py
      - name: Guard the portable HAL state-kernel layout
        run: bash conformance/check-hal-layout.sh
      - name: Guard the portable HAL contracts
        run: |
          bash conformance/check-hal-contracts-a.sh
          bash conformance/check-hal-contracts-b.sh
      - name: Guard readiness and security boundaries
        run: bash conformance/check-hal-security.sh

  hoplite-state:
    runs-on: ubuntu-latest
    env:
      HARA_REVISION: 45eebddeca2a61e490337c90821b30b2328749e0
      HOPLITE_REVISION: 12796b70166d03b1e17d5b00bfa2817d7ab3a672
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Verify the reviewed dependency revision pins
        run: |
          test "$(tr -d '\n' < packaging/hara-revision)" = "$HARA_REVISION"
          test "$(tr -d '\n' < packaging/hoplite-revision)" = "$HOPLITE_REVISION"
      - name: Check out the reviewed Hara runtime
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara
          ref: ${{ env.HARA_REVISION }}
          path: .dependencies/technology/hara
          persist-credentials: false
      - name: Check out the reviewed Hoplite compatibility contracts
        uses: actions/checkout@v4
        with:
          repository: greenways-ai/hoplite
          ref: ${{ env.HOPLITE_REVISION }}
          path: .dependencies/technology/hoplite
          persist-credentials: false
      - name: Install the Cargo toolchain required by the locked graph
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - name: Build the reviewed Hara test runner
        run: cargo build --locked --release --manifest-path .dependencies/technology/hara/core/rust/Cargo.toml --bin hara
      - name: Stage the Hoplite-owned portable contracts
        run: |
          mkdir -p .conformance-src/hoplite
          cp .dependencies/technology/hoplite/migration/value/src/hoplite/value.hal .conformance-src/hoplite/value.hal
          cp .dependencies/technology/hoplite/core/lib/src/hoplite/response_source.hal .conformance-src/hoplite/response_source.hal
      - name: Run the Hoplite-backed state conformance suites
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("project.edn")
          source = path.read_text()
          source = source.replace(':project/source-paths ["src"]', ':project/source-paths ["src" ".conformance-src"]')
          if source == path.read_text():
              raise SystemExit("project.edn source paths were not updated")
          path.write_text(source)
          PY
          .dependencies/technology/hara/core/rust/target/release/hara test

  native-migration-source:
    name: Transitional native metadata migration source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the reviewed Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Check the transitional metadata source formatting
        run: cargo fmt --manifest-path native/Cargo.toml --all -- --check
      - name: Preserve frozen migration behavior until issue #17 removes it
        run: cargo test --locked --quiet --manifest-path native/Cargo.toml --workspace
