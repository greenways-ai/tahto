name: Tahto conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository and route boundaries
        run: python3 conformance/check-bootstrap.py
      - name: Validate stable fabric records and fixtures
        run: python3 conformance/check-protocol.py
      - name: Check conformance script syntax
        run: |
          python3 -m py_compile conformance/check-bootstrap.py
          python3 -m py_compile conformance/check-protocol.py
      - name: Guard the Hara-only state-kernel boundary
        run: |
          test ! -e src-python
          test ! -e test-python
          test ! -e .github/workflows/materialize-native-metadata-lock.yml
          test ! -e .github/workflows/promote-native-metadata-sqlite.yml
          test -f src/tahto/store/model.hal
          test -f src/tahto/store/host.hal
          test -f src/tahto/store/capability.hal
          test -f src/tahto/store/upload.hal
          test -f src/tahto/store/response_source.hal
          test -f src/tahto/store/memory_blob.hal
          test -f src/tahto/store/memory_store.hal
          test -f src/tahto/store/vault.hal
          test -f src/tahto/store/graph.hal
          test -f src/tahto/store/history.hal
          test -f src/tahto/store/transaction.hal
          test -f src/tahto/store/provider.hal
          test -f src/tahto/sync/device.hal
          test -f src/tahto/sync/session.hal
          test -f src/tahto/service/state.hal
          test -f src/tahto/protocol/validate.hal
          test -f test/tahto/store/vault_test.hal
          test -f test/tahto/store/graph_test.hal
          test -f test/tahto/store/history_test.hal
          test -f test/tahto/store/vault_hardening_test.hal
          test -f test/tahto/store/transaction_test.hal
          test -f test/tahto/store/provider_test.hal
          test -f test/tahto/store/capability_test.hal
          test -f test/tahto/store/upload_test.hal
          test -f test/tahto/store/response_source_test.hal
          test -f test/tahto/store/memory_blob_test.hal
          test -f test/tahto/store/memory_store_test.hal
          test -f test/tahto/sync/device_test.hal
          test -f test/tahto/sync/session_test.hal
          test -f test/tahto/service/state_test.hal
          test -f protocol/services.md
          test -f protocol/transactions.md
          test -f protocol/metadata-store.md
          test -f protocol/metadata-host.md
          test -f protocol/host-capabilities.md
          test -f protocol/upload-integration.md
          test -f protocol/response-sources.md

          grep -F '(def host-service "hara.blob")' src/tahto/store/capability.hal
          grep -F '(def host-service "hara.store")' src/tahto/store/provider.hal
          grep -F '(ns tahto.store.upload' src/tahto/store/upload.hal
          grep -F '(ns tahto.store.response-source' src/tahto/store/response_source.hal
          grep -F '[std.foundation.response-source :as portable]' src/tahto/store/response_source.hal
          grep -F 'portable/response-source?' src/tahto/store/response_source.hal
          grep -F '(ns tahto.store.memory-blob' src/tahto/store/memory_blob.hal
          grep -F '(ns tahto.store.memory-store' src/tahto/store/memory_store.hal
          grep -F '(vault/accept-install candidate translated)' src/tahto/store/upload.hal
          ! grep -R -F '(def native-abi' src/tahto
          ! grep -R -F ':native-abi' src/tahto
          ! grep -R -F '(def host-service "tahto.' src/tahto
          ! grep -R -F '"tahto-metadata-store/1"' src/tahto

  hara-state:
    runs-on: ubuntu-latest
    env:
      HARA_REVISION: 5577f2ac5d9ef4ee65264b4fe34588bbaf955398
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Verify the reviewed Hara revision pin
        run: test "$(tr -d '\n' < packaging/hara-revision)" = "$HARA_REVISION"
      - name: Check out the reviewed Hara runtime
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara
          ref: ${{ env.HARA_REVISION }}
          path: .hara
          persist-credentials: false
      - name: Install the Cargo toolchain required by the locked graph
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - name: Build the reviewed Hara CLI
        run: cargo build --locked --release --manifest-path .hara/core/rust/Cargo.toml --bin hara
      - name: Run the Hara state conformance suites
        run: .hara/core/rust/target/release/hara --project "$GITHUB_WORKSPACE" test

  native-migration-source:
    name: Transitional native metadata migration source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the reviewed Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Check the transitional metadata source formatting
        run: cargo fmt --manifest-path native/Cargo.toml --all -- --check
      - name: Preserve migration-source behavior until Hoplite #45 replaces it
        run: cargo test --locked --quiet --manifest-path native/Cargo.toml --workspace
