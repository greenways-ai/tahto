name: Connector code execution

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'agent/**'
      - 'chat/**'
      - 'codex/**'
      - 'copilot/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connector-code-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    outputs:
      protocol: ${{ steps.scope.outputs.protocol }}
      native: ${{ steps.scope.outputs.native }}
      website: ${{ steps.scope.outputs.website }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate the committed connector contract
        run: |
          bash -n scripts/connector/detect-code-scope scripts/connector/run-code
          scripts/connector/detect-code-scope --self-test
      - name: Select executable scopes
        id: scope
        env:
          CONNECTOR_BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          CONNECTOR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: scripts/connector/detect-code-scope

  protocol:
    needs: contract
    if: needs.contract.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute protocol scope
        run: scripts/connector/run-code protocol
      - name: Record execution evidence
        if: success()
        run: |
          mkdir -p connector-evidence
          cat > connector-evidence/protocol.txt <<EOF
          repository=greenways-ai/tahto
          scope=protocol
          base=${{ github.event.pull_request.base.sha || github.event.before || 'manual' }}
          head=${{ github.sha }}
          run=${{ github.run_id }}
          attempt=${{ github.run_attempt }}
          command=scripts/connector/run-code protocol
          EOF
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: connector-protocol-${{ github.run_id }}-${{ github.run_attempt }}
          path: connector-evidence/protocol.txt
          if-no-files-found: error
          retention-days: 14

  native:
    needs: contract
    if: needs.contract.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt,clippy
      - name: Execute native scope
        run: scripts/connector/run-code native
      - name: Record execution evidence
        if: success()
        run: |
          mkdir -p connector-evidence
          cat > connector-evidence/native.txt <<EOF
          repository=greenways-ai/tahto
          scope=native
          base=${{ github.event.pull_request.base.sha || github.event.before || 'manual' }}
          head=${{ github.sha }}
          run=${{ github.run_id }}
          attempt=${{ github.run_attempt }}
          command=scripts/connector/run-code native
          EOF
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: connector-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: connector-evidence/native.txt
          if-no-files-found: error
          retention-days: 14

  website:
    needs: contract
    if: needs.contract.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Execute website scope
        run: scripts/connector/run-code website
      - name: Record execution evidence
        if: success()
        run: |
          mkdir -p connector-evidence
          cat > connector-evidence/website.txt <<EOF
          repository=greenways-ai/tahto
          scope=website
          base=${{ github.event.pull_request.base.sha || github.event.before || 'manual' }}
          head=${{ github.sha }}
          run=${{ github.run_id }}
          attempt=${{ github.run_attempt }}
          command=scripts/connector/run-code website
          EOF
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: connector-website-${{ github.run_id }}-${{ github.run_attempt }}
          path: connector-evidence/website.txt
          if-no-files-found: error
          retention-days: 14

  evidence-gate:
    if: always()
    needs:
      - contract
      - protocol
      - native
      - website
    runs-on: ubuntu-latest
    steps:
      - name: Require a truthful connector result
        env:
          CONTRACT: ${{ needs.contract.result }}
          PROTOCOL: ${{ needs.protocol.result }}
          NATIVE: ${{ needs.native.result }}
          WEBSITE: ${{ needs.website.result }}
        run: |
          set -euo pipefail
          test "$CONTRACT" = success
          for result in "$PROTOCOL" "$NATIVE" "$WEBSITE"; do
            case "$result" in
              success|skipped) ;;
              *) echo "unexpected connector scope result: $result" >&2; exit 1 ;;
            esac
          done
