name: Promote SQLite metadata provider

on:
  push:
    branches: [agent/metadata-store-sqlite]

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      HARA_REVISION: 5ef7762c8b97d77f9976f7037bafed81499b42c5
      CARGO_INCREMENTAL: '0'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/metadata-store-sqlite
          fetch-depth: 0
      - name: Merge the current reviewed base
        run: |
          git config user.name "greenways-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main agent/metadata-store-sqlite
          git merge --no-edit origin/main
      - name: Check out the reviewed Hara revision
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara
          ref: 5ef7762c8b97d77f9976f7037bafed81499b42c5
          path: .hara
          persist-credentials: false
      - name: Install the reviewed Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Run protocol and repository guards
        run: |
          python3 conformance/check-bootstrap.py
          python3 conformance/check-protocol.py
          python3 -m py_compile conformance/check-bootstrap.py conformance/check-protocol.py
          test ! -e src-python
          test ! -e test-python
          test -f native/provider/metadata-sqlite/src/lib.rs
          test -f native/provider/metadata-sqlite/src/tests.rs
      - name: Verify and lock the native provider graph
        run: |
          cargo fmt --manifest-path native/Cargo.toml --all -- --check
          cargo test --quiet --manifest-path native/Cargo.toml --workspace
          cargo test --locked --quiet --manifest-path native/Cargo.toml --workspace
      - name: Run the complete Hara state conformance line
        run: |
          test "$(tr -d '\n' < packaging/hara-revision)" = "$HARA_REVISION"
          cargo build --locked --release --manifest-path .hara/core/rust/Cargo.toml --bin hara
          .hara/core/rust/target/release/hara --project "$GITHUB_WORKSPACE" test
      - name: Reconcile any concurrent lock materialization
        run: |
          rm -rf .hara
          git fetch origin agent/metadata-store-sqlite
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/agent/metadata-store-sqlite)" ]; then
            git merge --no-edit origin/agent/metadata-store-sqlite
          fi
          cargo fmt --manifest-path native/Cargo.toml --all -- --check
          cargo test --locked --quiet --manifest-path native/Cargo.toml --workspace
      - name: Restore permanent locked CI and remove promotion scaffolding
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/bootstrap-conformance.yml')
          source = path.read_text()
          source = source.replace(
              'cargo test --quiet --manifest-path native/Cargo.toml --workspace',
              'cargo test --locked --quiet --manifest-path native/Cargo.toml --workspace',
          )
          source = source.replace(
              'cargo test --manifest-path native/Cargo.toml --workspace',
              'cargo test --locked --quiet --manifest-path native/Cargo.toml --workspace',
          )
          source = source.replace(
              '''      - name: Capture the generated native dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: tahto-native-cargo-lock
          path: native/Cargo.lock
          if-no-files-found: error
''',
              '',
          )
          source = source.replace(
              '''      - name: Print the generated native dependency lock
        run: cat native/Cargo.lock
''',
              '',
          )
          path.write_text(source)
          PY
          rm -f .github/workflows/materialize-native-metadata-lock.yml
          rm .github/workflows/promote-native-metadata-sqlite.yml
          git add native/Cargo.lock .github/workflows/bootstrap-conformance.yml .github/workflows/materialize-native-metadata-lock.yml .github/workflows/promote-native-metadata-sqlite.yml
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Lock the SQLite metadata provider dependency graph"
          fi
          git push origin HEAD:agent/metadata-store-sqlite
      - name: Merge the exact conformance-tested provider head
        run: |
          head_sha="$(git rev-parse HEAD)"
          gh pr ready 13 --repo greenways-ai/tahto || true
          gh api --method PUT repos/greenways-ai/tahto/pulls/13/merge \
            -f merge_method=merge \
            -f sha="$head_sha" \
            -f commit_title='Add the SQLite metadata compare-and-swap provider (#13)' \
            -f commit_message='Add the first concrete tahto-metadata-store/1 provider with SHA-256 state verification, exact revision CAS, idempotent receipts, schema-version protection and atomic rollback conformance.'
